name: graphes
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Installation de graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Rend executable
        run: chmod +x ./run1.sh

      - name: Lancement graphviz
        run: ./run1.sh g1
